services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartoffice
      POSTGRES_USER: smartoffice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartoffice"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: .
      dockerfile: core-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://smartoffice:${POSTGRES_PASSWORD}@postgres:5432/smartoffice
      UPLOADS_DIR: /data/uploads
      PORT: 8080
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN}
      MDM_COLLECTOR_TOKEN: ${MDM_COLLECTOR_TOKEN}
      MDM_BOOTSTRAP_UNTIL: ${MDM_BOOTSTRAP_UNTIL}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8090:8080"
    networks: [internal]

  # Dev-only: Vite dev server with hot reload, proxying /api and /uploads to core-api.
  # Not part of the production image (core-api serves the built frontend directly on :8090).
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [core-api]
    environment:
      VITE_API_PROXY_TARGET: http://core-api:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5174:5173"
    networks: [internal]

  # TEMPORARY: reverted to the free Quick Tunnel to get SmartOffice back online immediately -
  # the named tunnel (command: tunnel run, with CLOUDFLARE_TUNNEL_TOKEN below) had no Public
  # Hostname route configured in the Cloudflare dashboard, so nothing resolved publicly even
  # though the tunnel connector itself was connected. Switch back once that route exists:
  #   command: tunnel run
  #   environment: { TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN} }
  # Quick Tunnel downside (why this is temporary, not the end state): the URL is random and
  # changes every time this container restarts - printed in `docker compose logs cloudflared`.
  # Fine for a human clicking a link, not fine for the Mosyle collector script's hardcoded
  # target URL (mosyle/collect-desk-info.sh) - finish the named-tunnel route before relying on
  # this for that.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --url http://core-api:8080
    depends_on: [core-api]
    networks: [internal]

  backup:
    image: prodrigestivill/postgres-backup-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: smartoffice
      POSTGRES_USER: smartoffice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - pgbackups:/backups
    networks: [internal]

volumes:
  pgdata:
  uploads:
  pgbackups:
  frontend_node_modules:

networks:
  internal:
